name: Verify

on:
  pull_request:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project verification
        run: npm run verify
        env:
          PROGRESS_BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          PROGRESS_HEAD_SHA: ${{ github.sha }}
